<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>NX500 — 2.5D</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #edeef0;
        touch-action: none; overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
      canvas { display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
      #startScreen {
        position: fixed; inset: 0; z-index: 15; display: flex; flex-direction: column;
        align-items: center; justify-content: center; text-align: center;
        background: #000; color: #f2f2f2; font-family: monospace;
      }
      #startScreen .title { font-size: clamp(26px, 5vw, 46px); font-weight: 700; letter-spacing: 0.1em; line-height: 1.35; }
      #startScreen .title span { color: #8a8c90; font-size: 0.5em; letter-spacing: 0.22em; }
      #startLoading { margin-top: 34px; font-size: 13px; letter-spacing: 0.25em; color: #7a7c80; }
      #startBtn {
        display: none; margin-top: 34px; font-family: monospace; font-size: 16px; font-weight: 700;
        letter-spacing: 0.2em; padding: 13px 44px; background: transparent; border: 2px solid #ff2e2e;
        color: #ff2e2e; cursor: pointer;
      }
      #startBtn:hover { background: rgba(255, 46, 46, 0.12); }
      #legPicker { display: flex; gap: 12px; margin-top: 30px; flex-wrap: wrap; justify-content: center; }
      #legPicker .legBtn {
        font-family: monospace; font-size: 11px; letter-spacing: 0.16em; padding: 9px 16px;
        border: 1px solid #444; color: #8a8c90; text-decoration: none;
        transition: border-color 0.15s, color 0.15s;
      }
      #legPicker .legBtn:hover { border-color: #aaa; color: #ddd; }
      #legPicker .legBtn.active { border-color: #ff2e2e; color: #ff2e2e; }
      .hud {
        position: fixed; font-family: monospace; color: #17181a; user-select: none;
        letter-spacing: 0.08em; z-index: 5;
      }
      #time { top: 18px; left: 22px; font-size: 22px; font-weight: 600; }
      #dist { top: 46px; left: 22px; font-size: 12px; color: #6b6d70; }
      #speed { top: 18px; right: 22px; font-size: 22px; font-weight: 600; text-align: right; }
      #state { top: 46px; right: 22px; font-size: 12px; color: #6b6d70; text-align: right; }
      #msg {
        top: 42%; left: 50%; transform: translate(-50%, -50%); font-size: 24px; font-weight: 600;
        color: #17181a; text-align: center; display: none; white-space: pre-line; line-height: 1.7;
        background: rgba(237, 238, 240, 0.86); padding: 22px 34px; border-radius: 14px; z-index: 9;
      }
      #msg .msgActions { display: flex; gap: 12px; justify-content: center; margin-top: 18px; }
      #msg .msgActions button {
        font-family: monospace; font-size: 13px; font-weight: 700; letter-spacing: 0.14em;
        padding: 11px 20px; cursor: pointer; background: transparent; border-radius: 3px;
      }
      #msg .msgActions .primary { border: 2px solid #ff2e2e; color: #ff2e2e; }
      #msg .msgActions .primary:hover { background: rgba(255, 46, 46, 0.12); }
      #msg .msgActions .secondary { border: 1px solid #8a8c90; color: #6b6d70; }
      #msg .msgActions .secondary:hover { border-color: #17181a; color: #17181a; }
      #hint { bottom: 18px; left: 50%; transform: translateX(-50%); font-size: 11px; color: #9a9da2; }
      /* touch devices: the keyboard hint is meaningless — hide it */
      @media (pointer: coarse) { #hint { display: none; } }
      /* rotate-to-landscape overlay (portrait phones only) */
      #rotate {
        position: fixed; inset: 0; z-index: 20; display: none;
        align-items: center; justify-content: center; text-align: center;
        background: #edeef0; color: #17181a; font-family: monospace;
        font-size: 15px; letter-spacing: 0.18em; line-height: 2; padding: 0 12vw;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <canvas id="c"></canvas>
    <div id="startScreen">
      <div class="title">NX500<br><span>— THE GAME —</span></div>
      <div id="legPicker">
        <a class="legBtn" data-leg="pune" href="?leg=pune">01 · PUNE PLATEAU</a>
        <a class="legBtn" data-leg="ghats" href="?leg=ghats">02 · INTO THE GHATS</a>
        <a class="legBtn" data-leg="valley" href="?leg=valley">03 · MULSHI VALLEY</a>
        <a class="legBtn" data-leg="creeks" href="?leg=creeks">06 · CREEKS &amp; BACKWATERS</a>
      </div>
      <div id="startLoading">LOADING…</div>
      <button id="startBtn">START</button>
    </div>
    <div class="hud" id="time">0:00.0</div>
    <div class="hud" id="dist"></div>
    <div class="hud" id="speed">0 km/h</div>
    <div class="hud" id="state">ground</div>
    <div class="hud" id="msg"></div>
    <div class="hud" id="hint">W throttle · S brake · Space jump · A/D rotate in air · R restart</div>
    <div id="rotate">↻<br>rotate your device<br>to landscape</div>
    <script type="module" src="/src/game25/main25.js"></script>
  </body>
</html>
